# Static host for the built dashboard.
#
# Note what is deliberately NOT here: a proxy pass to the gateway. The dashboard
# talks to the gateway directly from the browser, so the gateway URL has to be
# an address the *user's machine* can reach (http://127.0.0.1:8080), not a
# Docker-internal name like http://gateway:8080 which only resolves inside the
# compose network. Getting this backwards produces a dashboard that loads fine
# and then shows nothing, with only a CORS/DNS error in the browser console.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames, so assets are immutable and can
    # be cached hard. index.html must not be, or a redeploy leaves browsers
    # pinned to an old bundle referencing assets that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
